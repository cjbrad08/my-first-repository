<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About | VetBoss</title>
  <link rel="stylesheet" href="/CSS/about-styles.css">
</head>
<body>

  <!--
      NAVIGATION BAR
      <nav> is a semantic tag that tells browsers and screen readers
      "this is the main navigation." The links live in an unordered list (<ul>),
      which is the standard, accessible way to build a menu
  -->
  <nav>
    <ul>
      <li><a href="/index.html">Home</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!--
      HERO SECTION
      <header> is a semantic tag for introductory content at the top of a page.
      class="hero" applies the blue gradient banner styles from the CSS.
  -->
  <header class="hero">
    <!-- .container centers the content and limits its width -->
    <div class="container">
      <!-- Main page heading. Each page should have exactly ONE <h1>. -->
      <h1>Hi, I'm First Name Last Name</h1>

      <p style="font-size: 1.3rem; opacity: 0.95;">Full-Stack Developer</p>
    </div>
  </header>

  <!--
      MAIN CONTENT AREA
      Everything below the hero lives inside this centered .container.
      Each topic is its own <section>, and each section has an <h2> heading.
      Using h1 -> h2 -> h3 in order creates a clear outline for readers and screen readers.
  -->
  <div class="container"></div>

  </body>
  </html>
