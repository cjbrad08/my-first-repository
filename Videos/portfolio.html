 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - CJ's Projects</title>
    <link rel="stylesheet" href="styles.css">
    </head>
    
  <body>
    <!-- Page header with title -->
    <header>
      <h1>CJ's Portfolio</h1>
    </header>

    <!-- Main content area -->
    <main>
      <h2>My Projects</h2>
      <!-- Portfolio grid container. Uses CSS grid to create a responsive layout that automatically changes the number of columns to fit the screen size -->
      <div class="portfolio-grid">
        <!-- Project Card 1 -->
        <div class="project">
          <img src="https://picsum.photos/id/1018/600/300" alt="Project 1" />
          <!-- Link to view project. target="blank" open the link to a new tab. In real projects; consider adding rel="noopener" for security -->
          <a href="https://example.com/project1" target="_blank"
            >View Project 1</a
          >
        </div>

        <!-- Project Card 2-->
        <div class="project">
          <img src="https://picsum.photos/id/180/600/300" alt="Project 2" />
          <a href=" https://example.com/project2" target="_blank"
            >View Project 2</a
          >
        </div>

        <!-- Project Card 3 -->
        <div class="project">
          <img src="https://picsum.photos/id/251/600/300" alt="Project 3" />
          <a href="https://example.com/project3" target="_blank"
            >View Project 3</a
          >
        </div>

        <!-- Project Card 4 -->
        <div class="project">
          <img src="https://picsum.photos/id/1015/600/300" alt="Project 4" />
          <a href="https://example.com/project4" target="_blank"
            >View Project 4</a
          >
        </div>
      </div>

      <!-- back to Home navigation link -->
      <a href="index.html" class="back-link">← Back to Home</a>
    </main>
    <footer>
      <p>&copy; 2026 VetBoss</p>
    </footer>
  </body>
</html>
